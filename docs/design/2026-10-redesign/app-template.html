<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kennel Today Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Atkinson+Hyperlegible+Next:wght@400;500;600&family=Atkinson+Hyperlegible+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FFFFFF; --side: #F6F5F2; --line: #ECEAE5; --line-strong: #E1DED7;
  --ink: #1F1F1E; --ink-2: #63615C; --ink-3: #9B9890; --hover: #EEECE7; --active: #E7E4DD;
  --attn: #B7791F; --attn-bg: #FBF6EC; --ok: #3F7D45; --down: #B4432F;
  --kit: #6E62C9; --paloma: #B5527A; --vault: #3C7F86; --home: #9A6B3C; --anth: #4C6FA8; --mac: #A3A09A;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --title: var(--sans); --title-size: 20px; --title-weight: 600; --title-style: normal;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1C1C1B; --side: #222220; --line: #2E2D2A; --line-strong: #3A3935;
    --ink: #ECEAE5; --ink-2: #A9A69F; --ink-3: #75736D; --hover: #2B2A27; --active: #33322E;
    --attn: #D9A24A; --attn-bg: #2A2519; --ok: #6FAE73; --down: #E07A64;
  }
}
:root[data-theme="dark"] {
  --bg: #1C1C1B; --side: #222220; --line: #2E2D2A; --line-strong: #3A3935;
  --ink: #ECEAE5; --ink-2: #A9A69F; --ink-3: #75736D; --hover: #2B2A27; --active: #33322E;
  --attn: #D9A24A; --attn-bg: #2A2519; --ok: #6FAE73; --down: #E07A64;
}
:root[data-font="geist"] { --sans: "Geist", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace; --title: var(--sans); }
:root[data-font="plex"] { --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace; --title: var(--sans); }
:root[data-font="atkinson"] { --sans: "Atkinson Hyperlegible Next", system-ui, sans-serif; --mono: "Atkinson Hyperlegible Mono", ui-monospace, monospace; --title: var(--sans); }
:root[data-font="schibsted"] { --sans: "Schibsted Grotesk", system-ui, sans-serif; --mono: ui-monospace, "SF Mono", Menlo, monospace; --title: "Instrument Serif", Georgia, serif; --title-size: 28px; --title-weight: 400; }
:root[data-font="schibsted"] body { font-variant-numeric: normal; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
svg.i { width: 16px; height: 16px; flex: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--kit); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--mono); font-size: .92em; }

.app { display: flex; min-height: 100vh; }
.side { width: 232px; flex: none; background: var(--side); border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; }
.brand { padding: 2px 8px; }
.brand-name { font-size: 14px; font-weight: 600; letter-spacing: -0.005em; }
.brand-sub { font-size: 12px; color: var(--ink-3); }
.search { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 8px; width: 100%; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 7px; color: var(--ink-3); cursor: text; text-align: left; }
.search span:first-of-type { flex: 1; }
.kbd { font-family: var(--sans); font-size: 11px; color: var(--ink-3); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 4px; line-height: 16px; }
.group { display: flex; flex-direction: column; gap: 1px; }
.group-label { font-size: 11px; font-weight: 600; color: var(--ink-3); padding: 0 8px 5px; display: flex; justify-content: space-between; }
.group-label button { border: 0; background: none; padding: 0; color: var(--ink-3); font-size: 11px; cursor: pointer; }
.nav { display: flex; align-items: center; gap: 9px; height: 28px; padding: 0 8px; border-radius: 6px; color: var(--ink-2); text-decoration: none; border: 0; background: transparent; width: 100%; text-align: left; cursor: pointer; }
.nav:hover { background: var(--hover); color: var(--ink); }
.nav[aria-current="page"], .nav[aria-pressed="true"] { background: var(--active); color: var(--ink); font-weight: 600; }
.nav .label { flex: 1; }
.nav .count { font-size: 12px; color: var(--ink-3); font-weight: 400; }
.nav .count.hot { color: var(--attn); font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; margin: 0 4px; }
.side-foot { margin-top: auto; padding: 0 8px; display: flex; flex-direction: column; gap: 10px; }
.foot-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--ink-3); }
.live { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); display: inline-block; margin-right: 6px; }
.hint { background: none; border: 0; padding: 0; color: var(--ink-3); cursor: pointer; font-size: 12px; }
.hint:hover { color: var(--ink); }
.digs { color: var(--ink-3); background: none; border: 0; padding: 0; cursor: pointer; width: 56px; height: 42px; align-self: flex-end; margin: -4px -4px -6px 0; }
.digs svg { width: 100%; height: 100%; display: block; overflow: visible; }
.digs:hover { color: var(--ink-2); }
.digs .digs-tail { transform-origin: 46px 37px; }
.digs.wag .digs-tail { animation: wag .5s ease-in-out 2; }
@keyframes wag { 50% { transform: rotate(-14deg); } }

.main { flex: 1; min-width: 0; }
.wrap { max-width: 800px; margin: 0 auto; padding: 36px 40px 64px; display: flex; flex-direction: column; gap: 30px; }
.head h1 { margin: 0; font-family: var(--title); font-size: var(--title-size); font-weight: var(--title-weight); letter-spacing: -0.01em; line-height: 1.15; }
.head p { margin: 4px 0 0; color: var(--ink-2); }
section h2 { margin: 0 0 6px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
section h2 small { font-size: 12px; font-weight: 400; color: var(--ink-3); }

.attn { display: flex; align-items: center; gap: 12px; padding: 11px 14px; background: var(--attn-bg); border: 1px solid color-mix(in srgb, var(--attn) 22%, transparent); border-radius: 9px; }
.attn + .attn { margin-top: -22px; }
.attn > .i { color: var(--attn); }
.attn-body { flex: 1; min-width: 0; cursor: pointer; }
.attn-title { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.attn-meta { color: var(--ink-2); }
.attn-actions { display: flex; gap: 6px; }
.tag { font-size: 12px; font-weight: 500; color: var(--ink-2); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.tag .dot { width: 6px; height: 6px; margin: 0; }
.btn { height: 28px; padding: 0 11px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--bg); font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { opacity: .88; background: var(--ink); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.danger { color: var(--down); }

.list { border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 88px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 38px; padding: 7px 4px; border-bottom: 1px solid var(--line); }
.row .time { color: var(--ink-3); white-space: nowrap; }
.row .name { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row .name b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.state { color: var(--ink-3); font-size: 12px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.state.ok { color: var(--ok); } .state.warn { color: var(--attn); } .state.down { color: var(--down); }
.check { width: 13px; height: 13px; }

/* view tables */
.vt-head, .vt-row { display: grid; grid-template-columns: 22px minmax(0, 1.6fr) minmax(0, .9fr) minmax(0, .9fr) 16px; gap: 12px; align-items: center; padding: 0 6px; }
.vt-head { font-size: 11px; font-weight: 600; color: var(--ink-3); height: 28px; border-bottom: 1px solid var(--line); }
.vt-row { min-height: 50px; padding-top: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 0; }
.vt-row:hover { background: color-mix(in srgb, var(--hover) 55%, transparent); }
.vt-row[aria-selected="true"] { background: var(--hover); }
.vt-name { min-width: 0; }
.vt-name b { font-weight: 500; display: flex; align-items: center; gap: 8px; }
.vt-name > span { display: block; color: var(--ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vt-col { color: var(--ink-2); font-size: 12px; min-width: 0; }
.vt-col small { display: block; color: var(--ink-3); }
.vt-row .chev { color: var(--ink-3); width: 14px; height: 14px; }
.g { display: inline-grid; place-items: center; width: 16px; height: 16px; }
.g .dot { margin: 0; width: 7px; height: 7px; }
.g svg { width: 15px; height: 15px; }
.vt-group { font-size: 12px; font-weight: 600; color: var(--ink-2); padding: 18px 6px 6px; }
.empty { color: var(--ink-3); padding: 24px 6px; }

/* timeline */
.tl { position: relative; height: 104px; margin: 6px 0 0; }
.tl-seg { position: absolute; top: 44px; height: 1px; background: var(--line-strong); }
.tl-gap { position: absolute; top: 37px; height: 15px; display: flex; align-items: center; justify-content: center; color: var(--ink-3); }
.tl-gap svg { width: 14px; height: 14px; }
.tl-ev { position: absolute; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%; border: 1.5px solid var(--ink-2); background: var(--bg); }
.tl-ev.done { background: var(--ok); border-color: var(--ok); }
.tl-ev.problem { background: var(--attn); border-color: var(--attn); }
.tl-label { position: absolute; top: 60px; transform: translateX(-50%); font-size: 11px; color: var(--ink-3); white-space: nowrap; text-align: center; line-height: 1.35; }
.tl-label b { display: block; font-weight: 500; color: var(--ink-2); }
.tl-now { position: absolute; top: 18px; height: 52px; width: 1px; background: var(--ink); }
.tl-now span { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 600; letter-spacing: .02em; }
.tl-tick { position: absolute; top: 60px; font-size: 10px; color: var(--ink-3); }
.tl-loops { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); }
.tl-loops i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; background: color-mix(in srgb, var(--ok) 55%, transparent); }

/* detail panel */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.12); opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 5; }
.scrim.open { opacity: 1; pointer-events: auto; }
.panel { visibility: hidden; position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100vw); background: var(--bg); border-left: 1px solid var(--line-strong); box-shadow: -16px 0 40px rgba(0,0,0,.08); transform: translateX(100%); transition: transform .2s ease; z-index: 6; overflow: auto; }
.panel.open { transform: none; visibility: visible; }
.p-wrap { padding: 20px 24px 40px; display: flex; flex-direction: column; gap: 22px; }
.p-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.p-top h2 { margin: 0; font-family: var(--title); font-size: calc(var(--title-size) - 2px); font-weight: var(--title-weight); letter-spacing: -0.01em; line-height: 1.2; }
.p-sub { display: flex; gap: 10px; align-items: center; margin-top: 6px; color: var(--ink-3); font-size: 12px; }
.p-purpose { color: var(--ink-2); font-size: 13px; margin: 0; }
.p-close { border: 0; background: none; color: var(--ink-3); cursor: pointer; padding: 4px; border-radius: 6px; }
.p-close:hover { background: var(--hover); color: var(--ink); }
.p-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.facts { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px 14px; margin: 0; font-size: 12px; }
.facts dt { color: var(--ink-3); }
.facts dd { margin: 0; color: var(--ink); overflow-wrap: anywhere; }
.p-h { font-size: 12px; font-weight: 600; margin: 0 0 8px; display: flex; justify-content: space-between; }
.p-h small { font-weight: 400; color: var(--ink-3); }
.runs { display: flex; gap: 5px; align-items: center; }
.runs i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line-strong); }
.runs i.done { background: var(--ok); border-color: var(--ok); }
.runs i.fail { background: var(--attn); border-color: var(--attn); }
.note { color: var(--ink-3); font-size: 12px; margin: 8px 0 0; }
.log { margin: 0; font-family: var(--mono); font-size: 11.5px; line-height: 1.6; color: var(--ink-2); background: var(--side); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; }

/* help, toast, fonts */
.help-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.18); display: none; align-items: center; justify-content: center; z-index: 10; }
.help-backdrop.open { display: flex; }
.help { width: 320px; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 12px; padding: 16px 18px; box-shadow: 0 12px 40px rgba(0,0,0,.18); }
.help h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; }
.help dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; align-items: center; }
.help dd { margin: 0; color: var(--ink-2); }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 8px); background: var(--ink); color: var(--bg); font-size: 12px; padding: 7px 12px; border-radius: 7px; opacity: 0; transition: opacity .15s, transform .15s; pointer-events: none; z-index: 11; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.fonts { display: flex; flex-wrap: wrap; gap: 4px; }
.fonts button { border: 1px solid var(--line-strong); background: var(--bg); color: var(--ink-2); border-radius: 5px; font-size: 11px; padding: 2px 6px; cursor: pointer; }
.fonts button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .toast, .panel, .scrim { transition: none; } .digs.wag .digs-tail { animation: none; } }

@media (max-width: 760px) {
  .app { flex-direction: column; }
  .side { width: auto; height: auto; position: static; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px; border-right: 0; border-bottom: 1px solid var(--line); }
  .side .group, .side-foot { display: none; }
  .search { flex: 1; min-width: 140px; width: auto; }
  .wrap { padding: 22px 16px 48px; gap: 26px; }
  .attn { flex-wrap: wrap; align-items: flex-start; }
  .attn-actions { width: 100%; padding-left: 28px; }
  .row { grid-template-columns: 72px minmax(0, 1fr); }
  .row .state { grid-column: 2; }
  .vt-head { display: none; }
  .vt-row { grid-template-columns: 22px minmax(0, 1fr) 16px; }
  .vt-row .vt-col { display: none; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    /*DIGS*/
    <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></g></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 18l6-6l-6-6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-fold" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M8 18 12 6M13 18 17 6"/></symbol>
    <symbol id="i-today" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></g></symbol>
    <symbol id="i-daemons" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><path d="M6 6h.01M6 18h.01"/></g></symbol>
    <symbol id="i-scheduled" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></g></symbol>
    <symbol id="i-agents" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2m16 0h2m-7-1v2m-6-2v2"/></g></symbol>
    <symbol id="i-hidden" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575a1 1 0 0 1 0 .696a10.8 10.8 0 0 1-1.444 2.49m-6.41-.679a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151a1 1 0 0 1 0-.696a10.75 10.75 0 0 1 4.446-5.143M2 2l20 20"/></g></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="m21 21l-4.34-4.34"/><circle cx="11" cy="11" r="8"/></g></symbol>
  </defs>
</svg>
<div class="app">
  <aside class="side" aria-label="Kennel">
    <div class="brand"><div class="brand-name">Kennel</div><div class="brand-sub">Mac Mini</div></div>
    <button class="search" type="button" aria-label="Search jobs"><svg class="i"><use href="#i-search"/></svg><span>Search</span><span class="kbd">⌘K</span></button>
    <nav class="group" aria-label="Views" id="views"></nav>
    <div class="group" role="group" aria-label="Filter by domain">
      <div class="group-label">Domains <button type="button" id="clear-domains" hidden>Clear</button></div>
      <div id="domains" class="group"></div>
    </div>
    <div class="side-foot">
      <div>
        <div class="group-label" style="padding:0 0 5px">Typeface <span style="font-weight:400">t</span></div>
        <div class="fonts" id="fonts"></div>
      </div>
      <div class="foot-row"><span><span class="live"></span>Live</span><button class="hint" type="button" id="help-open">Shortcuts <span class="kbd">?</span></button></div>
      <button class="digs" type="button" id="digs" aria-label="Digs"><svg viewBox="0 0 64 48"><use id="digs-use" href="#sleep"/></svg></button>
    </div>
  </aside>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" aria-label="Job details" aria-hidden="true"></aside>
<div class="help-backdrop" id="help" role="dialog" aria-modal="true" aria-labelledby="help-title">
  <div class="help">
    <h3 id="help-title">Keyboard shortcuts</h3>
    <dl>
      <dt><span class="kbd">⌘K</span></dt><dd>Search jobs</dd>
      <dt><span class="kbd">1</span>–<span class="kbd">5</span></dt><dd>Today, Daemons, Scheduled, Agents, Hidden</dd>
      <dt><span class="kbd">j</span> <span class="kbd">k</span></dt><dd>Move through a list</dd>
      <dt><span class="kbd">↵</span></dt><dd>Open the selected job</dd>
      <dt><span class="kbd">d</span></dt><dd>Dark or light mode</dd>
      <dt><span class="kbd">f</span></dt><dd>Text size</dd>
      <dt><span class="kbd">t</span></dt><dd>Next typeface</dd>
      <dt><span class="kbd">?</span></dt><dd>This list</dd>
      <dt><span class="kbd">esc</span></dt><dd>Close</dd>
    </dl>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
var JOBS = /*JOBS*/;
(function () {
  var DOM = { kit: 'Kit', paloma: 'Paloma', vault: 'Vault and memory', home: 'Home and family', anth: 'Anthimeros', mac: 'Mac' };
  var SHORT = { kit: 'Kit', paloma: 'Paloma', vault: 'Vault', home: 'Home', anth: 'Anthimeros', mac: 'Mac' };
  var VIEWS = [
    { id: 'today', label: 'Today', icon: 'today' },
    { id: 'daemons', label: 'Daemons', icon: 'daemons', kind: 'daemon' },
    { id: 'scheduled', label: 'Scheduled', icon: 'scheduled', kind: 'scheduled' },
    { id: 'agents', label: 'Agents', icon: 'agents', kind: 'agent' },
    { id: 'hidden', label: 'Mac and third-party', icon: 'hidden', kind: 'hidden' }
  ];
  var FONTS = [
    { id: 'system', label: 'SF Pro' }, { id: 'geist', label: 'Geist' }, { id: 'plex', label: 'Plex' },
    { id: 'atkinson', label: 'Atkinson' }, { id: 'schibsted', label: 'Schibsted + Serif' }
  ];
  var state = { view: 'today', domains: new Set(), sel: -1, open: null };
  var root = document.documentElement;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function tag(d) { return '<span class="tag"><span class="dot" style="background: var(--' + d + ')"></span>' + SHORT[d] + '</span>'; }
  function problem(j) { return j.state === 'failed' || j.state === 'down'; }
  function glyph(j) {
    if (j.state === 'failed') return '<span class="g" style="color:var(--attn)" title="Last run failed"><svg><use href="#i-alert"/></svg></span>';
    if (j.state === 'down') return '<span class="g" style="color:var(--down)" title="Down"><svg><use href="#i-alert"/></svg></span>';
    if (j.state === 'up' || j.state === 'running') return '<span class="g" title="Running"><span class="dot" style="background:var(--ok)"></span></span>';
    if (j.state === 'stopped') return '<span class="g" title="Not running"><span class="dot" style="background:transparent;border:1.5px solid var(--ink-3)"></span></span>';
    return '<span class="g" style="color:var(--ok)" title="Last run succeeded"><svg><use href="#i-check"/></svg></span>';
  }
  function when(iso) { if (!iso) return ''; var d = new Date(iso); var day = d.toLocaleDateString('en-US', { weekday: 'short' }); return day + ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); }
  function visible(kind) { return JOBS.filter(function (j) { return (!kind || j.kind === kind) && (!state.domains.size || state.domains.has(j.domain)); }); }
  function count(kind) { return JOBS.filter(function (j) { return j.kind === kind; }).length; }
  var problems = JOBS.filter(function (j) { return problem(j) && j.kind !== 'hidden'; });

  function renderNav() {
    document.getElementById('views').innerHTML = VIEWS.map(function (v, i) {
      var c = v.kind ? (v.kind === 'hidden' ? 'hidden' : count(v.kind)) : problems.length;
      return '<a class="nav" href="#' + v.id + '"' + (state.view === v.id ? ' aria-current="page"' : '') + '><svg class="i"><use href="#i-' + v.icon + '"/></svg><span class="label">' + v.label + '</span><span class="count' + (!v.kind && c ? ' hot' : '') + '">' + c + '</span></a>';
    }).join('');
    document.getElementById('domains').innerHTML = Object.keys(DOM).filter(function (d) { return d !== 'mac'; }).map(function (d) {
      return '<button class="nav" type="button" data-d="' + d + '" aria-pressed="' + state.domains.has(d) + '"><span class="dot" style="background: var(--' + d + ')"></span><span class="label">' + DOM[d] + '</span></button>';
    }).join('');
    document.getElementById('clear-domains').hidden = !state.domains.size;
    document.getElementById('fonts').innerHTML = FONTS.map(function (f) { return '<button type="button" data-f="' + f.id + '" aria-pressed="' + ((root.getAttribute('data-font') || 'system') === f.id) + '">' + f.label + '</button>'; }).join('');
  }

  function attnRow(j) {
    return '<div class="attn" role="status"><svg class="i"><use href="#i-alert"/></svg><div class="attn-body" data-open="' + esc(j.id) + '"><div class="attn-title">' + esc(j.name) + ' ' + tag(j.domain) + '</div><div class="attn-meta">' +
      (j.state === 'down' ? 'Down. ' : 'Last run exited with code ' + esc(j.exit) + '. ') + esc(j.purpose) + '</div></div><div class="attn-actions"><button class="btn primary" type="button">Ask Kit to fix</button><button class="btn" type="button" data-open="' + esc(j.id) + '">Details</button><button class="btn quiet" type="button">Mute</button></div></div>';
  }

  function renderToday() {
    var ps = problems.filter(function (j) { return !state.domains.size || state.domains.has(j.domain); });
    var total = JOBS.filter(function (j) { return j.kind !== 'hidden'; }).length;
    var h = '<header class="head"><h1>Today</h1><p>Tuesday, Oct 6 · ' + (total - problems.length) + ' of ' + total + ' jobs healthy</p></header>';
    h += ps.map(attnRow).join('');
    h += '<section aria-labelledby="tl-h"><h2 id="tl-h">Today\'s runs <small>quiet stretches folded</small></h2><div class="tl" id="tl" role="img" aria-label="Timeline of today\'s runs"></div><div class="tl-loops"><i></i>Plus the jobs that run every few minutes, all healthy</div></section>';
    var up = [['1:00 PM', 'com.alexpriest.task.claude-code-changelog', 'First run'], ['9:00 PM', 'com.alexpriest.task.memory-distillation', 'First run'], ['Wed 4:55 AM', 'com.alexpriest.task.daily-briefing', 'Last run took 4m 03s'], ['Fri 4:00 PM', 'com.alexpriest.task.weekly-review', 'First run']];
    var ran = [['3:30 AM', 'com.alexpriest.alog-build'], ['5:00 AM', 'com.alexpriest.kit-imessage-rebuild'], ['5:00 AM', 'com.alexpriest.crm-contacts']];
    function byId(id) { return JOBS.filter(function (j) { return j.id === id; })[0]; }
    h += '<section aria-labelledby="up"><h2 id="up">Coming up</h2><div class="list">' + up.map(function (r) { var j = byId(r[1]); return j ? '<div class="row" data-open="' + esc(j.id) + '" style="cursor:pointer"><span class="time">' + r[0] + '</span><span class="name"><b>' + esc(j.name) + '</b>' + tag(j.domain) + '</span><span class="state">' + r[2] + '</span></div>' : ''; }).join('') + '</div></section>';
    h += '<section aria-labelledby="ran"><h2 id="ran">Ran today <small>all succeeded</small></h2><div class="list">' + ran.map(function (r) { var j = byId(r[1]); return j ? '<div class="row" data-open="' + esc(j.id) + '" style="cursor:pointer"><span class="time">' + r[0] + '</span><span class="name"><b>' + esc(j.name) + '</b>' + tag(j.domain) + '</span><span class="state ok"><svg class="check"><use href="#i-check"/></svg>Succeeded</span></div>' : ''; }).join('') + '</div></section>';
    document.getElementById('view').innerHTML = h;
    drawTimeline();
  }

  function colsFor(kind, j) {
    if (kind === 'daemon') return ['<div class="vt-col">' + (j.state === 'up' ? 'Running' : j.state === 'down' ? 'Down' : 'Not running') + (j.pid ? '<small class="mono">pid ' + esc(j.pid) + '</small>' : '') + '</div>', '<div class="vt-col">' + esc(j.backend) + '<small>' + (j.exit && j.exit !== '0' && j.exit !== '?' ? 'last exit ' + esc(j.exit) : 'no errors') + '</small></div>'];
    if (kind === 'agent') return ['<div class="vt-col">' + esc(j.schedule || '') + '<small>' + (j.next ? 'next ' + when(j.next) : '') + '</small></div>', '<div class="vt-col">' + (j.last ? when(j.last) : 'Not run yet') + '<small>' + (j.dur ? Math.floor(j.dur / 60) + 'm ' + (j.dur % 60) + 's' : '') + '</small></div>'];
    if (kind === 'hidden') return ['<div class="vt-col">' + (j.state === 'running' ? 'Running' : 'Idle') + '</div>', '<div class="vt-col">' + esc(j.backend) + '</div>'];
    return ['<div class="vt-col">' + esc(j.schedule || '') + '</div>', '<div class="vt-col">' + (j.state === 'failed' ? '<span class="state warn">Failed, exit ' + esc(j.exit) + '</span>' : '<span class="state ok"><svg class="check"><use href="#i-check"/></svg>Last run fine</span>') + '</div>'];
  }
  var HEADS = { daemon: ['Status', 'Runs under'], scheduled: ['Schedule', 'Last result'], agent: ['Schedule', 'Last run'], hidden: ['Status', 'Runs under'] };
  var BLURB = {
    daemon: 'Long-running services that should always be up.',
    scheduled: 'Jobs that run on a timer and then go quiet until next time.',
    agent: 'Scheduled Claude sessions that work from a task doc in your vault.',
    hidden: 'Background items from macOS and other apps. Shown for completeness, never alerted on.'
  };
  function renderList(v) {
    var rows = visible(v.kind).sort(function (a, b) { return (problem(b) - problem(a)) || a.name.localeCompare(b.name); });
    var p = rows.filter(problem).length;
    var h = '<header class="head"><h1>' + v.label + '</h1><p>' + BLURB[v.kind] + ' ' + rows.length + (p ? ', ' + p + ' need a look.' : ', all healthy.') + '</p></header>';
    h += '<section><div class="vt-head"><span></span><span>Job</span><span>' + HEADS[v.kind][0] + '</span><span>' + HEADS[v.kind][1] + '</span><span></span></div><div role="listbox" aria-label="' + v.label + '" id="vt">';
    var lastGroup = null;
    rows.forEach(function (j, i) {
      var group = problem(j) ? 'Needs a look' : (p ? 'Healthy' : null);
      if (group && group !== lastGroup) { h += '<div class="vt-group">' + group + '</div>'; lastGroup = group; }
      h += '<div class="vt-row" role="option" tabindex="-1" data-open="' + esc(j.id) + '" data-i="' + i + '" aria-selected="' + (state.sel === i) + '">' + glyph(j) + '<div class="vt-name"><b>' + esc(j.name) + ' ' + tag(j.domain) + '</b><span>' + esc(j.purpose || j.id) + '</span></div>' + colsFor(v.kind, j).join('') + '<svg class="chev"><use href="#i-chev"/></svg></div>';
    });
    if (!rows.length) h += '<div class="empty">Nothing here with the current filters.</div>';
    h += '</div></section>';
    document.getElementById('view').innerHTML = h;
  }

  function render() { renderNav(); var v = VIEWS.filter(function (x) { return x.id === state.view; })[0] || VIEWS[0]; if (v.kind) renderList(v); else renderToday(); }

  function openJob(id) {
    var j = JOBS.filter(function (x) { return x.id === id; })[0]; if (!j) return;
    state.open = id;
    var acts = '';
    if (problem(j)) acts += '<button class="btn primary" type="button">Ask Kit to fix</button>';
    if (j.kind === 'daemon') acts += (j.state === 'up' ? '<button class="btn" type="button">Restart</button><button class="btn danger" type="button">Stop</button>' : '<button class="btn" type="button">Start</button>');
    else acts += '<button class="btn' + (problem(j) ? '' : ' primary') + '" type="button">Run now</button><button class="btn" type="button">Pause schedule</button>';
    if (j.doc) acts += '<a class="btn quiet" href="' + esc(j.doc) + '">Task doc</a>';
    var kindLabel = { daemon: 'Daemon', scheduled: 'Scheduled job', agent: 'Agent', hidden: 'Third-party' }[j.kind];
    var stateText = { up: 'Running', down: 'Down', stopped: 'Not running', failed: 'Last run failed', running: 'Running now', ok: 'Healthy' }[j.state];
    var facts = '';
    if (j.schedule) facts += '<dt>Schedule</dt><dd>' + esc(j.schedule) + '</dd>';
    if (j.next) facts += '<dt>Next run</dt><dd>' + when(j.next) + '</dd>';
    if (j.last) facts += '<dt>Last run</dt><dd>' + when(j.last) + (j.dur ? ', took ' + Math.floor(j.dur / 60) + 'm ' + (j.dur % 60) + 's' : '') + '</dd>';
    facts += '<dt>Last exit code</dt><dd>' + esc(j.exit === '?' ? 'none recorded' : j.exit) + '</dd>';
    if (j.pid) facts += '<dt>Process</dt><dd class="mono">pid ' + esc(j.pid) + '</dd>';
    facts += '<dt>Launch label</dt><dd class="mono">' + esc(j.id) + '</dd>';
    if (j.log) facts += '<dt>Log</dt><dd class="mono">' + esc(j.log.replace('/Users/alex', '~')) + '</dd>';
    var runs = '';
    if (j.kind === 'scheduled' || j.kind === 'agent') {
      var rec = (j.recent || []).slice(-14), dots = '';
      for (var i = 0; i < 14 - rec.length; i++) dots += '<i></i>';
      rec.forEach(function (r) { dots += '<i class="' + (r === 'failed' ? 'fail' : 'done') + '"></i>'; });
      runs = '<section><div class="p-h">Recent runs <small>' + (rec.length ? rec.length + ' recorded' : 'none recorded yet') + '</small></div><div class="runs">' + dots + '</div>' + (rec.length < 3 ? '<p class="note">Run history fills in once every job is wrapped by kennel-run (phase one of the build).</p>' : '') + '</section>';
    }
    var logBlock = '<section><div class="p-h">Log <small>last lines, live in the real app</small></div><pre class="log">' + (j.state === 'failed' ? 'exited with code ' + esc(j.exit) + '\n(the real app shows the last 50 lines here, regular and error output merged)' : '(the real app shows the last 50 lines here, regular and error output merged)') + '</pre></section>';
    document.getElementById('panel').innerHTML = '<div class="p-wrap"><div class="p-top"><div><h2>' + esc(j.name) + '</h2><div class="p-sub">' + glyph(j) + '<span>' + stateText + '</span>·<span>' + kindLabel + '</span>·' + tag(j.domain) + '</div></div><button class="p-close" type="button" aria-label="Close" id="p-close"><svg class="i"><use href="#i-x"/></svg></button></div>' +
      (j.purpose ? '<p class="p-purpose">' + esc(j.purpose) + '</p>' : '') + '<div class="p-actions">' + acts + '</div><dl class="facts">' + facts + '</dl>' + runs + logBlock + '</div>';
    document.getElementById('panel').classList.add('open'); document.getElementById('panel').setAttribute('aria-hidden', 'false');
    document.getElementById('scrim').classList.add('open');
    document.getElementById('p-close').addEventListener('click', closeJob);
    setDigs();
  }
  function closeJob() { state.open = null; document.getElementById('panel').classList.remove('open'); document.getElementById('panel').setAttribute('aria-hidden', 'true'); document.getElementById('scrim').classList.remove('open'); }

  // Timeline with folded gaps and stacked dots for simultaneous runs
  var EVENTS = [
    { h: 3.5, names: ['Activity digest'], s: 'done' },
    { h: 5, names: ['Kit rebuild', 'CRM contacts'], s: 'done' },
    { h: 13, names: ['Changelog'], s: 'next' },
    { h: 21, names: ['Memory'], s: 'next' }
  ];
  var NOW = 10, GAP = 2.5, FOLD_W = 26, MIN = 120;
  function fmt(h) { var hr = Math.floor(h), m = Math.round((h - hr) * 60); var ap = hr >= 12 && hr < 24 ? 'PM' : 'AM'; return (hr % 12 || 12) + (m ? ':' + String(m).padStart(2, '0') : '') + ' ' + ap; }
  function drawTimeline() {
    var el = document.getElementById('tl'); if (!el) return;
    var W = el.clientWidth;
    var marks = [0].concat(EVENTS.map(function (e) { return e.h; }), [NOW, 24]).sort(function (a, b) { return a - b; });
    var pad = 1, pieces = [], folds = 0, linear = 0;
    for (var i = 0; i < marks.length - 1; i++) {
      var a = marks[i], b = marks[i + 1]; if (b <= a) continue;
      if (b - a > GAP) { pieces.push({ a: a, b: a + pad }, { gap: true, from: a + pad, to: b - pad }, { a: b - pad, b: b }); folds++; linear += 2 * pad; }
      else { pieces.push({ a: a, b: b, min: a > 0 && b < 24 }); linear += b - a; }
    }
    var avail = W - folds * FOLD_W, k = avail / linear;
    for (var it = 0; it < 6; it++) { var fixed = 0, flex = 0; pieces.forEach(function (q) { if (q.gap) return; var w = (q.b - q.a) * k; if (q.min && w < MIN) fixed += MIN; else flex += q.b - q.a; }); k = Math.max(1, (avail - fixed) / flex); }
    var x = 0, map = [], html = '';
    pieces.forEach(function (q) {
      if (q.gap) { html += '<span class="tl-gap" style="left:' + x + 'px;width:' + FOLD_W + 'px" title="' + fmt(q.from) + ' to ' + fmt(q.to) + ', nothing scheduled"><svg><use href="#i-fold"/></svg></span>'; x += FOLD_W; return; }
      var w = (q.b - q.a) * k; if (q.min && w < MIN) w = MIN;
      map.push({ a: q.a, b: q.b, x0: x, k: w / (q.b - q.a) }); html += '<span class="tl-seg" style="left:' + x + 'px;width:' + w + 'px"></span>'; x += w;
    });
    function X(h) { for (var i = 0; i < map.length; i++) { var m = map[i]; if (h >= m.a && h <= m.b) return m.x0 + (h - m.a) * m.k; } return W; }
    html += '<span class="tl-tick" style="left:0">12 AM</span><span class="tl-tick" style="right:0">12 AM</span>';
    EVENTS.forEach(function (e) {
      var cls = e.s === 'done' ? 'done' : e.s === 'problem' ? 'problem' : '';
      e.names.forEach(function (n, i) { html += '<span class="tl-ev ' + cls + '" style="left:' + X(e.h) + 'px;top:' + (39 - i * 14) + 'px" title="' + fmt(e.h) + ' · ' + esc(n) + '"></span>'; });
      html += '<span class="tl-label" style="left:' + X(e.h) + 'px"><b>' + fmt(e.h) + '</b>' + (e.names.length > 1 ? e.names.length + ' jobs' : e.names[0]) + '</span>';
    });
    html += '<span class="tl-now" style="left:' + X(NOW) + 'px"><span>NOW</span></span>';
    el.innerHTML = html;
  }
  window.addEventListener('resize', drawTimeline);

  // Digs: asleep when all is healthy, ears up when something needs a look; click for one tail wag.
  function setDigs() { document.getElementById('digs-use').setAttribute('href', problems.length ? '#alert' : '#sleep'); }
  document.getElementById('digs').addEventListener('click', function () {
    var b = this, u = document.getElementById('digs-use'), prev = u.getAttribute('href');
    u.setAttribute('href', '#alert'); b.classList.remove('wag'); void b.offsetWidth; b.classList.add('wag');
    setTimeout(function () { b.classList.remove('wag'); u.setAttribute('href', prev); }, 1200);
  });

  // Routing and events
  function route() { var id = (location.hash || '#today').slice(1); if (id.indexOf('job/') === 0) { openJob(decodeURIComponent(id.slice(4))); return; } state.view = VIEWS.some(function (v) { return v.id === id; }) ? id : 'today'; state.sel = -1; closeJob(); render(); }
  window.addEventListener('hashchange', route);
  document.addEventListener('click', function (e) {
    var o = e.target.closest('[data-open]'); if (o) { e.preventDefault(); openJob(o.getAttribute('data-open')); return; }
    var d = e.target.closest('[data-d]'); if (d) { var k = d.getAttribute('data-d'); state.domains.has(k) ? state.domains.delete(k) : state.domains.add(k); render(); return; }
    var f = e.target.closest('[data-f]'); if (f) { setFont(f.getAttribute('data-f')); return; }
  });
  document.getElementById('clear-domains').addEventListener('click', function () { state.domains.clear(); render(); });
  document.getElementById('scrim').addEventListener('click', closeJob);

  var toastEl = document.getElementById('toast'), tt;
  function toast(m) { toastEl.textContent = m; toastEl.classList.add('show'); clearTimeout(tt); tt = setTimeout(function () { toastEl.classList.remove('show'); }, 1400); }
  function setFont(id) { if (id === 'system') root.removeAttribute('data-font'); else root.setAttribute('data-font', id); store('kennel-font', id); renderNav(); drawTimeline(); toast(FONTS.filter(function (f) { return f.id === id; })[0].label); }
  var theme = store('kennel-theme'); if (theme) root.setAttribute('data-theme', theme);
  var font = new URLSearchParams(location.search).get('font') || store('kennel-font'); if (font && font !== 'system') root.setAttribute('data-font', font);
  var size = store('kennel-size'); if (size) document.body.style.fontSize = size;
  function isDark() { var t = root.getAttribute('data-theme'); return t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches; }
  var help = document.getElementById('help');
  document.getElementById('help-open').addEventListener('click', function () { help.classList.add('open'); });
  help.addEventListener('click', function (e) { if (e.target === help) help.classList.remove('open'); });
  document.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); document.querySelector('.search').focus(); toast('Search'); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var a = document.activeElement, tagn = a && a.tagName.toLowerCase();
    if (tagn === 'input' || tagn === 'textarea' || (a && a.isContentEditable)) return;
    if (e.key === 'Escape') { help.classList.remove('open'); if (state.open) { closeJob(); if (location.hash.indexOf('#job/') === 0) history.replaceState(null, '', '#' + state.view); } return; }
    if (e.key === '?') { help.classList.toggle('open'); return; }
    if (e.key === 'd') { var next = isDark() ? 'light' : 'dark'; root.setAttribute('data-theme', next); store('kennel-theme', next); toast(next === 'dark' ? 'Dark mode' : 'Light mode'); return; }
    if (e.key === 'f') { var sizes = ['12px', '13px', '14px'], cur = document.body.style.fontSize || '13px', n = sizes[(sizes.indexOf(cur) + 1) % 3]; document.body.style.fontSize = n; store('kennel-size', n); drawTimeline(); toast('Text ' + { '12px': 'small', '13px': 'regular', '14px': 'large' }[n]); return; }
    if (e.key === 't') { var cf = root.getAttribute('data-font') || 'system', idx = FONTS.map(function (f) { return f.id; }).indexOf(cf); setFont(FONTS[(idx + 1) % FONTS.length].id); return; }
    if (/^[1-5]$/.test(e.key)) { location.hash = '#' + VIEWS[+e.key - 1].id; return; }
    var rows = document.querySelectorAll('.vt-row');
    if ((e.key === 'j' || e.key === 'k') && rows.length) { state.sel = Math.max(0, Math.min(rows.length - 1, state.sel + (e.key === 'j' ? 1 : -1))); rows.forEach(function (r, i) { r.setAttribute('aria-selected', i === state.sel); }); rows[state.sel].scrollIntoView({ block: 'nearest' }); return; }
    if (e.key === 'Enter' && rows.length && state.sel >= 0) { openJob(rows[state.sel].getAttribute('data-open')); }
  });
  setDigs(); route();
  var qs = new URLSearchParams(location.search).get('job'); if (qs) openJob(qs);
})();
</script>
</body>
</html>
